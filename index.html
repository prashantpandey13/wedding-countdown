<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prashant Ki Pratiksha 💍</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="stars"></div>

<div class="overlay"></div>

<div class="container">
  <div class="hero-slider">
    <img src="IMG_2394.JPG" class="active" loading="eager">
    <img src="IMG_2399.JPG" loading="lazy">
    <img src="IMG_2357.JPG" loading="lazy">
  </div>
  <h1 class="title">
    Prashant 
    <span class="heart-wrap">
      <span class="cupid">👼</span>
      <span class="arrow">➶</span>
      <span class="main-heart">❤️</span>
    </span>
    Pratiksha
  </h1>
  <p class="tag">#PrashantKiPratiksha</p>

  <div class="date">20th April 2026</div>

  <div id="countdown" class="countdown">
  <div class="time-box">
    <span id="days">0</span>
    <label>Days</label>
  </div>
  <div class="time-box">
    <span id="hours">0</span>
    <label>Hours</label>
  </div>
  <div class="time-box">
    <span id="minutes">0</span>
    <label>Minutes</label>
  </div>
  <div class="time-box">
    <span id="seconds">0</span>
    <label>Seconds</label>
  </div>
</div>

  <div class="story">
    <p>
      From a beautiful beginning on <strong>05th March 2019</strong>,
      engaged on <strong>29th Nov 2025</strong>
      to forever on <strong>20th April 2026</strong> 💫  
    </p>
  </div>
</div>

<canvas id="confetti"></canvas>

<button id="musicToggle">🎵</button>

<audio id="bgMusic" loop>
  <source src="your-music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
<div class="hearts"></div>
</body>
</html>
